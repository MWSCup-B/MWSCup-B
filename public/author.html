<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲーム作成 — インシデント調査ゲーム</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/author.js"></script>
</head>
<body>
  <header><p>インシデント調査ゲーム</p></header>
  <main class="author-main">
    <section id="creation-panel" aria-labelledby="author-title">
      <h1 id="author-title">ゲーム作成</h1>
      <h2>攻撃手法</h2>
      <div class="fixed-attack"><strong>XSS</strong><span>Cross-Site Scripting</span></div>
      <fieldset><legend>ネットワーク</legend><div id="network-list" class="network-card-grid"></div></fieldset>
      <fieldset><legend>難易度</legend><div id="difficulty-list" class="difficulty-options"></div></fieldset>
      <div class="button-row"><button id="generate" type="button">ゲームを生成</button></div>
      <p id="form-error" role="alert"></p>
    </section>
    <section id="generation-panel" aria-labelledby="generation-title" hidden>
      <h1 id="generation-title">ゲームを生成しています</h1>
      <ol id="generation-progress" class="generation-progress"></ol>
      <div class="button-row"><button id="cancel" class="secondary" type="button">生成を中止</button></div>
      <details><summary>詳細</summary><div id="detail-list" class="detail-list"></div></details>
    </section>
    <section id="ready-panel" aria-labelledby="ready-title" hidden>
      <h1 id="ready-title">ゲームが完成しました</h1>
      <ol id="ready-progress" class="generation-progress"></ol>
      <a id="play-game" class="button-link" href="/">ゲーム開始</a>
    </section>
    <section id="failure-panel" aria-labelledby="failure-title" hidden>
      <h1 id="failure-title">ゲームの自動生成に失敗しました。</h1>
      <p id="failure-message"></p>
      <button id="retry" type="button">もう一度生成</button>
      <details><summary>詳細</summary><div id="failure-details" class="detail-list"></div></details>
    </section>
  </main>
</body>
</html>
